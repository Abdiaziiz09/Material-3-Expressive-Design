site_name: M3 Expressive for Flutter
site_description: An independent, source-traceable implementation guide for Material 3 Expressive-informed Flutter interfaces.
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
nav:
  - Overview: overview.md
  - AI agent guide: agent-guide.md
  - Foundations: foundations.md
  - Components: components.md
  - Flutter: flutter.md
  - Android and iOS: platforms.md
  - Evidence and sources: evidence.md
